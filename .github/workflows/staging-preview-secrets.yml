name: Staging preview secrets (sealed transfer)

# Moves the staging secrets the Vercel preview needs out of the GitHub "staging"
# environment without anyone seeing them: each value is sealed (libsodium sealed box) to
# the one-time public key in ops/preview-transfer.pub, whose private key never leaves the
# operator's session, and only the ciphertext is kept, as a 1-day artifact. The operator
# decrypts in memory and writes the values to Vercel as "sensitive" variables of the
# preview branch (scripts/preview-env-sync.py). Staging only; production is never read.
on:
  push:
    paths: ['ops/preview-transfer.pub']

permissions:
  contents: read

concurrency:
  group: staging-preview-secrets
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-latest
    environment: staging
    env:
      DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
      SECRET_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_AUTH_DATABASE_URL: ${{ secrets.AUTH_DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Optional: forwarded only when the staging environment has them.
      REDIS_URL: ${{ secrets.REDIS_URL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Application roles only (bahith_app, bahith_auth): the admin URL gives the host,
      # never its credentials. The pooled Neon endpoint suits serverless functions.
      - name: Role URLs from DATABASE_ADMIN_URL's host + the secrets' passwords (masked)
        run: pnpm --filter @bahith/db exec tsx src/cli/role-urls.ts
      - name: Seal to the one-time public key (ciphertext only)
        run: |
          python3 -m venv "$RUNNER_TEMP/nacl" && "$RUNNER_TEMP/nacl/bin/pip" install --quiet pynacl==1.5.0
          "$RUNNER_TEMP/nacl/bin/python" - <<'PY'
          import base64, json, os, pathlib
          from nacl.public import PublicKey, SealedBox
          key = pathlib.Path('ops/preview-transfer.pub').read_text().split()[0]
          box = SealedBox(PublicKey(base64.b64decode(key)))
          r2 = all(os.environ.get(n) for n in ('R2_ACCOUNT_ID', 'R2_ACCESS_KEY_ID', 'R2_SECRET_ACCESS_KEY'))
          values = {
              'DATABASE_URL': os.environ['DATABASE_URL'],
              'AUTH_DATABASE_URL': os.environ['AUTH_DATABASE_URL'],
              'OPENAI_API_KEY': os.environ.get('OPENAI_API_KEY', ''),
              'REDIS_URL': os.environ.get('REDIS_URL', ''),
              **{n: os.environ.get(n, '') for n in ('SMTP_HOST', 'SMTP_PORT', 'SMTP_SECURE', 'SMTP_USER', 'SMTP_PASSWORD', 'SMTP_FROM')},
          }
          if r2:
              values.update({
                  'S3_ENDPOINT': f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com",
                  'S3_REGION': 'auto',
                  'S3_BUCKET': 'bahith-staging-files',
                  'S3_ACCESS_KEY_ID': os.environ['R2_ACCESS_KEY_ID'],
                  'S3_SECRET_ACCESS_KEY': os.environ['R2_SECRET_ACCESS_KEY'],
                  'S3_FORCE_PATH_STYLE': 'true',
              })
          present = {k: v for k, v in values.items() if v}
          sealed = {k: base64.b64encode(box.encrypt(v.encode())).decode() for k, v in present.items()}
          pathlib.Path('sealed.json').write_text(json.dumps({'key': key, 'sealed': sealed}))
          print('sealed (names only):', ', '.join(sorted(sealed)))
          print('absent in environment staging (names only):', ', '.join(sorted(set(values) - set(present))) or 'none')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: preview-sealed-secrets
          path: sealed.json
          retention-days: 1
