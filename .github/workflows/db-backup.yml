name: Database backup and restore test

# Daily logical backup of production to Cloudflare R2, then a restore of that same
# backup into a throwaway Postgres in the runner, which checks checksums, migrations and
# row counts. A failed restore fails the job (and GitHub notifies).
# Secrets (environment "production"): DATABASE_ADMIN_URL, DATABASE_URL,
# AUTH_DATABASE_URL, R2_ACCOUNT_ID, R2_BACKUP_BUCKET, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY.
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTH_DATABASE_URL: ${{ secrets.AUTH_DATABASE_URL }}
    services:
      restore-target:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: restore-check-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Postgres 18 client (same major as Neon)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - name: Backup
        run: |
          [ -n "$DATABASE_ADMIN_URL" ] || { echo "::error::production secrets are not set"; exit 1; }
          pnpm --filter @bahith/db exec tsx src/cli/backup.ts --allow-remote --dir="$RUNNER_TEMP/backup"
      - name: Restore test into an empty server
        env:
          DATABASE_ADMIN_URL: postgresql://postgres:restore-check-only@localhost:5432/postgres
        run: pnpm --filter @bahith/db exec tsx src/cli/restore.ts --dir="$RUNNER_TEMP/backup"
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          stamp=$(date -u +%Y-%m-%dT%H%MZ)
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/bahith-$stamp.tgz" backup
          aws s3 cp "$RUNNER_TEMP/bahith-$stamp.tgz" "s3://${{ secrets.R2_BACKUP_BUCKET }}/db/bahith-$stamp.tgz" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
