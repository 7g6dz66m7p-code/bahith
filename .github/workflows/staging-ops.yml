name: Staging operations

# Staging only. Runs when ops/staging-run.txt changes on a branch (manual dispatch needs
# the workflow on the default branch). Order: migrate + verify (with a rolled-back
# isolation smoke) -> R2 storage check -> backup + restore test. Production is never
# touched here (its workflows are manual, behind the "production" environment).
on:
  push:
    paths: ['ops/staging-run.txt']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-ops
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: staging
    env:
      DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTH_DATABASE_URL: ${{ secrets.AUTH_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Secrets present (names only)
        run: |
          for v in DATABASE_ADMIN_URL DATABASE_URL AUTH_DATABASE_URL; do
            [ -n "${!v}" ] || { echo "::error::$v is not set in environment staging"; exit 1; }
          done
      - name: Migrate, provision roles, revoke foreign privileges
        run: pnpm --filter @bahith/db exec tsx src/cli/migrate.ts --allow-remote
      - name: Reference data
        run: pnpm --filter @bahith/db exec tsx src/cli/seed.ts --allow-remote
      - name: Verify schema, RLS, roles, pgvector and isolation (rolled back)
        run: pnpm --filter @bahith/db exec tsx src/cli/verify-deployment.ts --allow-remote --isolation-smoke

  storage:
    needs: migrate
    runs-on: ubuntu-latest
    environment: staging
    env:
      S3_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      S3_REGION: auto
      S3_BUCKET: ${{ vars.R2_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      S3_FORCE_PATH_STYLE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bahith/pipeline exec tsx src/cli/storage-check.ts

  backup:
    needs: migrate
    runs-on: ubuntu-latest
    environment: staging
    env:
      DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTH_DATABASE_URL: ${{ secrets.AUTH_DATABASE_URL }}
    services:
      restore-target:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: restore-check-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Postgres 18 client (same major as Neon)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - name: Backup Neon staging
        run: pnpm --filter @bahith/db exec tsx src/cli/backup.ts --allow-remote --dir="$RUNNER_TEMP/backup"
      - name: Restore into an empty server and verify checksums, migrations, row counts
        env:
          DATABASE_ADMIN_URL: postgresql://postgres:restore-check-only@localhost:5432/postgres
        run: pnpm --filter @bahith/db exec tsx src/cli/restore.ts --dir="$RUNNER_TEMP/backup"
      - name: Upload the verified backup to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          stamp=$(date -u +%Y-%m-%dT%H%MZ)
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/bahith-staging-$stamp.tgz" backup
          aws s3 cp "$RUNNER_TEMP/bahith-staging-$stamp.tgz" "s3://${{ vars.R2_BACKUP_BUCKET }}/db-backups/bahith-staging-$stamp.tgz" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
