name: Production readiness (isolated)

on:
  push:
  workflow_dispatch:

concurrency:
  group: readiness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  BAHITH_TEST_PORT: '3200'

jobs:
  load-and-security:
    name: 50 users and authenticated OWASP ZAP baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - name: Install checksum-verified k6 and OWASP ZAP
        env:
          K6_SHA256: 5a5ecf23529ccf93135bc7e5b0c1cd5126ecf5f2672e22eed1556a0ab74abb87
          ZAP_SHA256: efe799aaa3627db683b43f00c9c210aea0b75c00cc8f0a0f0434d12bb3ddde5a
        run: |
          mkdir -p "$RUNNER_TEMP/readiness-tools"
          curl -fsSL https://github.com/grafana/k6/releases/download/v2.4.0/k6-v2.4.0-linux-amd64.tar.gz -o "$RUNNER_TEMP/k6.tar.gz"
          echo "$K6_SHA256  $RUNNER_TEMP/k6.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/k6.tar.gz" -C "$RUNNER_TEMP/readiness-tools"
          curl -fsSL https://github.com/zaproxy/zaproxy/releases/download/v2.17.0/ZAP_2.17.0_Linux.tar.gz -o "$RUNNER_TEMP/zap.tar.gz"
          echo "$ZAP_SHA256  $RUNNER_TEMP/zap.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/zap.tar.gz" -C "$RUNNER_TEMP/readiness-tools"
          rm "$RUNNER_TEMP/k6.tar.gz" "$RUNNER_TEMP/zap.tar.gz"
          echo "$RUNNER_TEMP/readiness-tools/k6-v2.4.0-linux-amd64" >> "$GITHUB_PATH"
          echo "ZAP_JAR=$RUNNER_TEMP/readiness-tools/ZAP_2.17.0/zap-2.17.0.jar" >> "$GITHUB_ENV"
      - name: Start disposable services, workers and production server
        run: |
          pnpm --filter @bahith/db exec tsx ../../apps/web/e2e/server.ts > "$RUNNER_TEMP/readiness-server.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/readiness-server.pid"
          node --input-type=module <<'JS'
          import { setTimeout as delay } from 'node:timers/promises';
          let ready = false;
          for (let attempt = 0; attempt < 480; attempt += 1) {
            try {
              const response = await fetch('http://localhost:3200/api/health', { signal: AbortSignal.timeout(1000) });
              if (response.ok) { ready = true; break; }
            } catch {}
            await delay(500);
          }
          if (!ready) throw new Error('Isolated production server did not become healthy in four minutes');
          JS
      - name: Prepare 50 verified users and actual ingested documents
        id: fixtures
        run: |
          mkdir -p apps/web/test-results/readiness
          pnpm --filter @bahith/web exec tsx e2e/readiness-fixtures.ts
      - name: k6 50 concurrent users, evidence correctness and user isolation
        if: ${{ !cancelled() && steps.fixtures.outcome == 'success' }}
        env:
          BAHITH_LOAD_FIXTURES: ${{ github.workspace }}/apps/web/.next/readiness-users.json
        run: k6 run --summary-export apps/web/test-results/readiness/k6-summary.json scripts/readiness/load.js
      - name: Authenticated OWASP ZAP passive baseline
        if: ${{ !cancelled() && steps.fixtures.outcome == 'success' }}
        run: node scripts/readiness/zap.mjs
      - name: Sanitized performance and security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-evidence
          path: apps/web/test-results/readiness/
          retention-days: 14
          if-no-files-found: ignore
      - name: Stop isolated server and remove temporary session fixtures
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/readiness-server.pid"; then kill -TERM "$(cat "$RUNNER_TEMP/readiness-server.pid")" || true; fi
          rm -f apps/web/.next/readiness-users.json
      - name: Failed server startup diagnostics
        if: failure()
        run: tail -200 "$RUNNER_TEMP/readiness-server.log"
