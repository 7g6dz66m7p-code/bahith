name: Staging secrets (sealed)

# Writes the R2 values for the staging environment from ops/staging-secrets.sealed.json.
# The values in that file are sealed (libsodium sealed box) to the staging environment's
# own public key, so only GitHub can decrypt them; nothing here, in the repository or in
# a log is ever in clear. Only the three R2 secret names are accepted, and only for the
# "staging" environment. Uses GH_SECRETS_TOKEN (fine-grained token, this repository only).
on:
  push:
    paths: ['ops/staging-secrets.sealed.json']

permissions:
  contents: read

concurrency:
  group: staging-secrets
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    environment: staging
    env:
      GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Token present (name only)
        run: |
          [ -n "$GH_TOKEN" ] || {
            echo "::error::GH_SECRETS_TOKEN is not set in environment staging (fine-grained token, repository ${REPO} only, Environments: read and write, Secrets: read)."
            exit 1
          }
      # The public key is public by design: it can only encrypt.
      - name: The staging environment's public key
        run: gh api "repos/$REPO/environments/staging/secrets/public-key" --jq '"key_id=\(.key_id)\nkey=\(.key)"'
      - name: Write the sealed R2 secrets
        run: |
          set -euo pipefail
          f=ops/staging-secrets.sealed.json
          if [ ! -f "$f" ] || [ "$(jq -r '.key_id // empty' "$f")" = "" ]; then
            echo "no sealed values in $f: nothing to write (the public key is printed above)"
            exit 0
          fi
          key_id=$(jq -r .key_id "$f")
          current=$(gh api "repos/$REPO/environments/staging/secrets/public-key" --jq .key_id)
          [ "$key_id" = "$current" ] || { echo "::error::sealed for key $key_id, the environment's key is $current"; exit 1; }
          for name in $(jq -r '.secrets | keys[]' "$f"); do
            case "$name" in
              R2_ACCOUNT_ID | R2_ACCESS_KEY_ID | R2_SECRET_ACCESS_KEY) ;;
              *) echo "::error::refusing to write $name (only the three R2 secrets)"; exit 1 ;;
            esac
            jq -n --arg v "$(jq -r --arg n "$name" '.secrets[$n]' "$f")" --arg k "$key_id" \
              '{encrypted_value: $v, key_id: $k}' |
              gh api -X PUT "repos/$REPO/environments/staging/secrets/$name" --input - --silent
            echo "written: $name"
          done
          echo "secrets now in environment staging (names only):"
          gh api "repos/$REPO/environments/staging/secrets" --jq '.secrets[].name'
