[project]
name = "bahith-worker"
version = "0.0.0"
description = "BAHITH document-processing worker: consumes BullMQ jobs from Redis."
requires-python = ">=3.12"
dependencies = [
    "bullmq>=3.6,<4",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.11,<3",
    "pypdf>=7.1,<8",
    "python-docx>=1.2,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
    "testcontainers[redis]>=4.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bahith_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs Docker (real Redis via Testcontainers); run with `pytest -m integration`",
]
# `pytest` runs the unit tests; integration tests run through `pnpm test:integration`.
addopts = "-m 'not integration' --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "ASYNC", "T20", "RUF"]
# Arabic text is expected in strings and comments (RUF001-003 flag "ambiguous" letters).
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
