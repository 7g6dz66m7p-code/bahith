# Isolated BAHITH staging stack: production builds of web, jobs and the document worker,
# with their own Postgres, Redis and S3 storage, volumes and network. It shares nothing
# with local development or production. Create its env with: pnpm staging:env
#
#   docker compose -f docker-compose.staging.yml --env-file .env.staging up -d --build
#
# To use managed services instead (e.g. Neon branch + Cloudflare R2), point DATABASE_*,
# REDIS_URL and S3_* in .env.staging at them and start only: migrate web jobs worker.
name: bahith-staging

x-app-env: &app-env
  env_file: .env.staging

services:
  # Staging never sends real e-mail: messages land in this inbox (http://127.0.0.1:8225).
  # `web` shares this container's network namespace so SMTP is genuinely on localhost:
  # the app requires TLS for any non-local SMTP server and that rule stays unchanged.
  # The web port is therefore published here.
  mailpit:
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    ports:
      - '127.0.0.1:${STAGING_MAIL_PORT:-8225}:8025'
      - '127.0.0.1:${STAGING_WEB_PORT:-3200}:3000'

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run "pnpm staging:env"}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run "pnpm staging:env"}
      POSTGRES_DB: ${POSTGRES_DB:?Run "pnpm staging:env"}
    volumes:
      - staging-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run "pnpm staging:env"}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory-policy noeviction
    volumes:
      - staging-redis:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 30

  minio:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?Run "pnpm staging:env"}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Run "pnpm staging:env"}
    command: server /data
    volumes:
      - staging-minio:/data
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /minio/health/live HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          read -r status <&3 && [[ "$$status" == *" 200 "* ]]
      interval: 5s
      timeout: 3s
      retries: 30

  # One-shot: migrations, role provisioning, reference data and the storage bucket.
  migrate:
    <<: *app-env
    build: { context: ., dockerfile: docker/node.Dockerfile, target: migrate }
    image: bahith-node:staging-migrate
    command:
      - sh
      - -c
      - >-
        pnpm --filter @bahith/db exec tsx src/cli/migrate.ts --allow-remote &&
        pnpm --filter @bahith/db exec tsx src/cli/seed.ts --allow-remote &&
        pnpm --filter @bahith/jobs exec tsx src/init-storage.ts --staging
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }

  web:
    <<: *app-env
    build: { context: ., dockerfile: docker/node.Dockerfile, target: web }
    image: bahith-node:staging-web
    restart: unless-stopped
    network_mode: 'service:mailpit'
    environment:
      SMTP_HOST: localhost
      # The image's Chromium for PDF export (an empty value in .env.staging would hide it).
      PDF_CHROMIUM_PATH: /usr/bin/chromium
    depends_on:
      # Joined to mailpit's network namespace: restart together with it.
      mailpit: { condition: service_started, restart: true }
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  jobs:
    <<: *app-env
    build: { context: ., dockerfile: docker/node.Dockerfile, target: jobs }
    image: bahith-node:staging-jobs
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    <<: *app-env
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    image: bahith-worker:staging
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  staging-postgres:
  staging-redis:
  staging-minio:
