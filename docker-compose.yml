# Local development services for BAHITH. Not a production deployment.
#
# Every credential comes from .env (never tracked). Create it with:  pnpm bootstrap
# All ports are published on 127.0.0.1 only.
name: bahith

services:
  # Local delivery inbox only. No real messages leave this development service.
  mailpit:
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    ports:
      - '127.0.0.1:${SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025'

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run "pnpm bootstrap" to create .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run "pnpm bootstrap" to create .env}
      POSTGRES_DB: ${POSTGRES_DB:?Run "pnpm bootstrap" to create .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run "pnpm bootstrap" to create .env}
    # BullMQ requires that no key is ever evicted.
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory-policy noeviction
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage. The upstream minio/minio image is no longer published
  # on Docker Hub, so this uses the community build of the same MinIO release
  # (see docs/reports/phase-1.md). The application only speaks the S3 API.
  minio:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?Run "pnpm bootstrap" to create .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Run "pnpm bootstrap" to create .env}
    command: server /data --console-address ":9001"
    ports:
      - '127.0.0.1:${MINIO_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      # The image ships neither curl nor wget: probe the liveness endpoint with bash.
      test:
        - CMD
        - bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /minio/health/live HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          read -r status <&3 && [[ "$$status" == *" 200 "* ]]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  minio-data:
